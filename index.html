<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>位值積木操作</title>
    <style>
        /* 基礎重置與防呆設定，防止反白與瀏覽器原生手勢干擾 */
        body { 
            margin: 0; font-family: '微軟正黑體', sans-serif; background-color: #f4f7f9; 
            touch-action: none; /* 禁用瀏覽器預設手勢 */
            user-select: none; /* 禁用文字反白選取 */
            -webkit-user-select: none; 
        }
        .header { text-align: center; padding: 20px 0; }
        .title { font-size: 28px; font-weight: bold; color: #333; }
        .subtitle { font-size: 18px; color: #7f8c8d; margin-top: 5px; }

        /* 位值表主區域 */
        .board { display: flex; justify-content: center; gap: 20px; padding: 20px; }
        .zone { width: 250px; height: 380px; border: 3px solid; border-radius: 10px; background: white; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        .zone-hundreds { border-color: #ff9999; }
        .zone-tens { border-color: #99e6cc; }
        .zone-ones { border-color: #ffeba8; }
        
        .zone-title { padding: 5px 20px; color: white; border-radius: 5px; margin-top: -15px; font-weight: bold; font-size: 20px;}
        .zone-hundreds .zone-title { background-color: #ff6666; }
        .zone-tens .zone-title { background-color: #4dc3a3; }
        .zone-ones .zone-title { background-color: #f1c40f; }

        .hint-text { font-size: 12px; color: #bdc3c7; margin-top: 10px; }

        /* 積木放置區 (十格陣) */
        .block-container { flex-grow: 1; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 10px; padding-top: 20px; }
        .ten-frame { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; justify-items: center; }
        
        .block { cursor: grab; z-index: 10; touch-action: none; user-select: none; }
        
        /* 個位數 (1個正方形) */
        .block-1 { 
            width: 28px; height: 28px; 
            background-color: #f1c40f; border: 1px solid #d4ac0d; border-radius: 4px;
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.1);
        }
        
        /* 十位數 (10個完美正方形組成的直條) */
        .block-10 { 
            display: flex; flex-direction: column; gap: 1px; 
            background: transparent; width: 28px; 
        }
        .cube-10 { 
            width: 28px; height: 28px; 
            background-color: #4dc3a3; border-radius: 3px; 
            pointer-events: none; /* 讓點擊穿透到母容器 */
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.1); 
        }

        /* 百位數 (10x10 正方形組成的陣列) */
        .block-100 { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; 
            width: 150px; background: transparent; 
        }
        .cube-100 { 
            width: 14px; height: 14px; 
            background-color: #ff6666; border-radius: 1px; 
            pointer-events: none; 
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.1); 
        }

        /* 底部操作區 */
        .footer { display: flex; justify-content: space-between; padding: 20px 40px; background: white; border-top: 2px solid #ecf0f1; position: fixed; bottom: 0; width: 100%; box-sizing: border-box;}
        
        /* 預備區 (兼具垃圾桶功能) */
        .source-area { display: flex; gap: 20px; align-items: flex-end; padding: 10px; border: 2px dashed #bdc3c7; border-radius: 10px; background-color: #f8f9fa; }
        .source-item { display: flex; flex-direction: column; align-items: center; }
        .source-label { font-size: 14px; color: #7f8c8d; margin-top: 5px; }

        .buttons button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 10px; }
        .btn-hint { background-color: #f1c40f; color: #fff; }
        .btn-submit { background-color: #8bc34a; color: #fff; }

        /* 正在拖曳時的虛擬分身樣式 */
        .dragging { position: fixed; opacity: 0.8; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">23 <span style="color: #e74c3c;">變成</span> 13</div>
        <div class="subtitle">請操作積木（拿走10）</div>
    </div>

    <!-- 位值表區域 -->
    <div class="board">
        <div class="zone zone-hundreds" id="zone-100">
            <div class="zone-title">百位</div>
            <div class="block-container" id="container-100"></div>
        </div>
        <div class="zone zone-tens" id="zone-10">
            <div class="zone-title">十位</div>
            <div class="hint-text">(拖至左下可移除)</div>
            <div class="block-container" id="container-10">
                <!-- 預設題目 23 的 2 個十位 -->
                <div class="block block-10" data-value="10"></div>
                <div class="block block-10" data-value="10"></div>
            </div>
        </div>
        <div class="zone zone-ones" id="zone-1">
            <div class="zone-title">個位</div>
            <div class="hint-text">(拖至左下可移除)</div>
            <div class="block-container ten-frame" id="container-1">
                 <!-- 預設題目 23 的 3 個個位 -->
                 <div class="block block-1" data-value="1"></div>
                 <div class="block block-1" data-value="1"></div>
                 <div class="block block-1" data-value="1"></div>
            </div>
        </div>
    </div>

    <!-- 底部：預備區 -->
    <div class="footer">
        <div class="source-area" id="source-area">
            <div class="source-item">
                <div class="block block-100" data-source="100"></div>
                <div class="source-label">百 (100)</div>
            </div>
            <div class="source-item">
                <div class="block block-10" data-source="10"></div>
                <div class="source-label">十 (10)</div>
            </div>
            <div class="source-item">
                <div class="block block-1" data-source="1"></div>
                <div class="source-label">一 (1)</div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn-hint">需要提示</button>
            <button class="btn-submit">提交答案</button>
        </div>
    </div>

<script>
    let isDragging = false;
    let draggedElement = null;
    let dragClone = null;
    let originalParent = null;

    const sourceArea = document.getElementById('source-area');
    const containers = {
        100: document.getElementById('container-100'),
        10: document.getElementById('container-10'),
        1: document.getElementById('container-1')
    };

    // 自動生成十位數和百位數內部的正方形，確保畫面完美
    function renderCubes() {
        document.querySelectorAll('.block-10').forEach(block => {
            if (block.children.length === 0) {
                for(let i=0; i<10; i++) block.innerHTML += '<div class="cube-10"></div>';
            }
        });
        document.querySelectorAll('.block-100').forEach(block => {
            if (block.children.length === 0) {
                for(let i=0; i<100; i++) block.innerHTML += '<div class="cube-100"></div>';
            }
        });
    }
    
    // 初始渲染
    renderCubes();

    function handleDragStart(e) {
        // 尋找最近的積木元素，避免點到內部的正方形而無法拖曳
        let target = e.target.closest('.block');
        if (!target) return;

        // 【關鍵修復】防止瀏覽器預設的反白選取與原生拖曳行為
        if (e.cancelable) e.preventDefault(); 

        isDragging = true;
        draggedElement = target;
        originalParent = target.parentElement;

        // 建立拖曳分身
        dragClone = target.cloneNode(true);
        dragClone.classList.add('dragging');
        document.body.appendChild(dragClone);

        // 如果積木是在位值表上，讓原本的變半透明
        if (!originalParent.closest('#source-area')) {
            draggedElement.style.opacity = '0.3';
        }

        // 立即移動分身到滑鼠/手指位置
        handleDragMove(e);
    }

    function handleDragMove(e) {
        if (!isDragging || !dragClone) return;
        
        // 防止在手機/iPad上拖曳時畫面跟著捲動
        if (e.cancelable) e.preventDefault(); 
        
        // 取得精確座標 (支援滑鼠與觸控)
        let clientX = e.clientX || (e.touches && e.touches[0].clientX);
        let clientY = e.clientY || (e.touches && e.touches[0].clientY);

        if (clientX === undefined || clientY === undefined) return;

        // 讓分身中心點跟著游標
        dragClone.style.left = (clientX - dragClone.offsetWidth / 2) + 'px';
        dragClone.style.top = (clientY - dragClone.offsetHeight / 2) + 'px';
    }

    function handleDragEnd(e) {
        if (!isDragging || !dragClone) return;
        isDragging = false;

        let clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
        let clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

        // 暫時隱藏分身，以便偵測底下是什麼區域
        dragClone.style.display = 'none';
        let targetElement = document.elementFromPoint(clientX, clientY);
        
        // 刪除分身，恢復原積木透明度
        dragClone.remove();
        dragClone = null;
        draggedElement.style.opacity = '1';

        let sourceRect = sourceArea.getBoundingClientRect();

        // 情況 A: 被丟回左下角的預備區 (代表要拿走/刪除)
        if (clientX >= sourceRect.left && clientX <= sourceRect.right &&
            clientY >= sourceRect.top && clientY <= sourceRect.bottom) {
            
            // 如果這塊積木本來就是在位值表上的，就把它刪掉
            if (!originalParent.closest('#source-area')) {
                draggedElement.remove();
            }
        } 
        // 情況 B: 被放進位值表中
        else {
            if (originalParent.closest('#source-area')) {
                let blockValue = draggedElement.getAttribute('data-source');
                let targetZone = targetElement ? targetElement.closest('.zone') : null;

                // 確認有沒有放對位置 (例如: 十位積木必須放在 zone-10)
                if (targetZone && targetZone.id === `zone-${blockValue}`) {
                    let newBlock = document.createElement('div');
                    newBlock.className = `block block-${blockValue}`;
                    newBlock.setAttribute('data-value', blockValue);
                    containers[blockValue].appendChild(newBlock);
                    
                    // 重新渲染內部的小正方形
                    renderCubes();
                }
            }
        }

        // 清除狀態
        draggedElement = null;
        originalParent = null;
    }

    // 滑鼠事件
    document.addEventListener('mousedown', handleDragStart, {passive: false});
    document.addEventListener('mousemove', handleDragMove, {passive: false});
    document.addEventListener('mouseup', handleDragEnd);

    // 觸控事件 (iPad 專用)
    document.addEventListener('touchstart', handleDragStart, {passive: false});
    document.addEventListener('touchmove', handleDragMove, {passive: false});
    document.addEventListener('touchend', handleDragEnd);
</script>

</body>
</html>
