<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>位值積木操作</title>
    <style>
        /* 基礎防呆，徹底防止 iPad 瀏覽器原生手勢干擾 */
        body { 
            margin: 0; font-family: '微軟正黑體', sans-serif; background-color: #f4f7f9; 
            touch-action: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
            overflow: hidden;
        }
        .header { text-align: center; padding: 20px 0; }
        .title { font-size: 32px; font-weight: bold; color: #333; }
        .subtitle { font-size: 18px; color: #7f8c8d; margin-top: 5px; }

        /* 位值表主區域 */
        .board { display: flex; justify-content: center; gap: 20px; padding: 10px; }
        .zone { width: 240px; height: 380px; border: 3px solid; border-radius: 10px; background: white; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        .zone-hundreds { border-color: #ff9999; }
        .zone-tens { border-color: #99e6cc; }
        .zone-ones { border-color: #ffeba8; }
        
        .zone-title { padding: 5px 20px; color: white; border-radius: 5px; margin-top: -15px; font-weight: bold; font-size: 20px;}
        .zone-hundreds .zone-title { background-color: #ff6666; }
        .zone-tens .zone-title { background-color: #4dc3a3; }
        .zone-ones .zone-title { background-color: #f1c40f; }

        .hint-text { font-size: 13px; color: #95a5a6; margin-top: 10px; }

        /* 存放積木的容器 */
        .block-container { 
            flex-grow: 1; width: 100%; display: flex; flex-wrap: wrap; 
            justify-content: center; align-content: flex-start; gap: 10px; padding-top: 20px; 
            box-sizing: border-box;
        }
        /* 個位數的十格陣排列法 */
        #container-1 { width: 60px; /* 強制兩排 (20+20+gap) */ gap: 5px; }

        /* 完美的積木比例設定 (基礎單位 20x20) */
        .block { 
            cursor: pointer; position: relative; box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            touch-action: none; -webkit-user-drag: none; 
        }
        
        .block-1 { 
            width: 20px; height: 20px; 
            background-color: #f1c40f; border: 1px solid #d4ac0d; border-radius: 2px;
            box-sizing: border-box;
        }
        
        .block-10 { 
            width: 20px; height: 200px; 
            background-color: #4dc3a3; border: 1px solid #1abc9c; border-radius: 2px;
            /* 畫出完美的 10 個正方形格線 */
            background-image: linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px);
            background-size: 20px 20px;
            box-sizing: border-box;
        }
        
        .block-100 { 
            width: 200px; height: 200px; 
            background-color: #ff6666; border: 1px solid #e74c3c; border-radius: 2px;
            /* 畫出完美的 10x10 正方形格線 */
            background-image: 
                linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px);
            background-size: 20px 20px, 20px 20px;
            box-sizing: border-box;
        }

        /* 預備區 (兼垃圾桶) */
        .footer { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: white; border-top: 2px solid #ecf0f1; position: fixed; bottom: 0; width: 100%; box-sizing: border-box;}
        
        .source-area { display: flex; gap: 30px; align-items: flex-end; padding: 10px 20px; border: 2px dashed #bdc3c7; border-radius: 10px; background-color: #f8f9fa; }
        .source-item { display: flex; flex-direction: column; align-items: center; touch-action: none; cursor: pointer; }
        .source-label { font-size: 14px; color: #7f8c8d; margin-top: 8px; font-weight: bold; }
        
        /* 預備區的縮小圖示，避免佔用太多空間 */
        .source-icon { border-radius: 2px; box-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
        .icon-100 { width: 50px; height: 50px; background-color: #ff6666; border: 1px solid #e74c3c; background-image: linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 5px 5px, 5px 5px; }
        .icon-10 { width: 15px; height: 50px; background-color: #4dc3a3; border: 1px solid #1abc9c; background-image: linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 100% 5px; }
        .icon-1 { width: 20px; height: 20px; background-color: #f1c40f; border: 1px solid #f39c12; }

        .buttons button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 10px; }
        .btn-hint { background-color: #f1c40f; color: #333; }
        .btn-submit { background-color: #8bc34a; color: #fff; }

        /* 拖曳中的分身 */
        .dragging { position: fixed; z-index: 1000; pointer-events: none; opacity: 0.9; margin: 0; }
        
        /* 提示閃爍特效 */
        .flash { animation: flashAnim 0.5s 3; }
        @keyframes flashAnim { 0% { background-color: white; } 50% { background-color: #fff3cd; box-shadow: inset 0 0 20px #f1c40f; } 100% { background-color: white; } }

        /* 自訂提示視窗 (取代 alert) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
            visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-content {
            background: white; padding: 40px; border-radius: 15px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: scale(0.8); transition: 0.2s; min-width: 300px;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-title { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .modal-text { font-size: 18px; color: #555; margin-bottom: 30px; }
        .modal-btn { background: #3498db; color: white; padding: 12px 35px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 自訂提示視窗 -->
    <div class="modal-overlay" id="custom-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">提示</div>
            <div class="modal-text" id="modal-text">訊息內容</div>
            <button class="modal-btn" onclick="closeModal()">我知道了</button>
        </div>
    </div>

    <div class="header">
        <div class="title">23 <span style="color: #e74c3c;">變成</span> 13</div>
        <div class="subtitle">請操作積木（拿走 10）</div>
    </div>

    <div class="board">
        <div class="zone zone-hundreds" id="zone-100">
            <div class="zone-title">百位</div>
            <div class="hint-text">(拖入增加/拖至左下移除)</div>
            <div class="block-container" id="container-100"></div>
        </div>
        <div class="zone zone-tens" id="zone-10">
            <div class="zone-title">十位</div>
            <div class="hint-text">(點擊可退位/拖至左下移除)</div>
            <div class="block-container" id="container-10">
                <!-- 預設：2 個十位積木 -->
                <div class="block block-10" data-value="10"></div>
                <div class="block block-10" data-value="10"></div>
            </div>
        </div>
        <div class="zone zone-ones" id="zone-1">
            <div class="zone-title">個位</div>
            <div class="hint-text">(拖至左下移除)</div>
            <div class="block-container" id="container-1">
                <!-- 預設：3 個個位積木 -->
                <div class="block block-1" data-value="1"></div>
                <div class="block block-1" data-value="1"></div>
                <div class="block block-1" data-value="1"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="source-area" id="source-area">
            <div class="source-item" data-source="100">
                <div class="source-icon icon-100"></div>
                <div class="source-label">百 (100)</div>
            </div>
            <div class="source-item" data-source="10">
                <div class="source-icon icon-10"></div>
                <div class="source-label">十 (10)</div>
            </div>
            <div class="source-item" data-source="1">
                <div class="source-icon icon-1"></div>
                <div class="source-label">一 (1)</div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn-hint" onclick="playHint()">需要提示</button>
            <button class="btn-submit" onclick="checkAnswer()">提交答案</button>
        </div>
    </div>

<script>
    // 阻擋原生拖曳，保證不出現禁止符號
    document.addEventListener('dragstart', (e) => e.preventDefault());

    let draggedElement = null;
    let dragClone = null;
    let dragType = ''; // 'new' 從下方來, 'move' 從上方來
    let startX = 0, startY = 0;
    let isDragging = false;
    let blockValue = null;

    document.addEventListener('pointerdown', handlePointerDown, { passive: false });
    document.addEventListener('pointermove', handlePointerMove, { passive: false });
    document.addEventListener('pointerup', handlePointerUp);

    function handlePointerDown(e) {
        // 防止觸控螢幕縮放或預設滾動
        if(e.target.closest('.block') || e.target.closest('.source-item')) {
            e.preventDefault();
        }

        const block = e.target.closest('.block');
        const sourceItem = e.target.closest('.source-item');

        if (block) {
            draggedElement = block;
            dragType = 'move';
            blockValue = block.getAttribute('data-value');
            startX = e.clientX;
            startY = e.clientY;
            isDragging = false; // 初始算作點擊，移動後才變拖曳
            
            // 產生分身
            dragClone = block.cloneNode(true);
            dragClone.classList.add('dragging');
            document.body.appendChild(dragClone);
            moveClone(e.clientX, e.clientY);
            block.style.opacity = '0.3'; // 原本的變半透明
        } 
        else if (sourceItem) {
            dragType = 'new';
            blockValue = sourceItem.getAttribute('data-source');
            isDragging = true;
            
            // 從預備區拉出來時，產生一個實體大小的積木分身
            dragClone = document.createElement('div');
            dragClone.className = `block block-${blockValue} dragging`;
            document.body.appendChild(dragClone);
            moveClone(e.clientX, e.clientY);
        }
    }

    function handlePointerMove(e) {
        if (!dragClone) return;
        e.preventDefault(); 
        
        // 如果移動超過 5px，就判定為「拖曳」而不是「單擊」
        if (!isDragging && dragType === 'move') {
            if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
                isDragging = true;
            }
        }
        
        if (isDragging || dragType === 'new') {
            moveClone(e.clientX, e.clientY);
        }
    }

    function moveClone(x, y) {
        const rect = dragClone.getBoundingClientRect();
        dragClone.style.left = (x - rect.width / 2) + 'px';
        dragClone.style.top = (y - rect.height / 2) + 'px';
    }

    function handlePointerUp(e) {
        if (!dragClone) return;

        const dropX = e.clientX;
        const dropY = e.clientY;
        dragClone.remove();
        dragClone = null;

        // 如果只是輕輕「點擊」(沒移動)，且是十位數，執行退位打碎
        if (dragType === 'move' && !isDragging) {
            draggedElement.style.opacity = '1';
            if (blockValue === '10') {
                breakTenBlock(draggedElement);
            }
            draggedElement = null;
            return;
        }

        // 放下時的邏輯判斷
        const targetElement = document.elementFromPoint(dropX, dropY);
        const targetZone = targetElement ? targetElement.closest('.zone') : null;
        const sourceAreaRect = document.getElementById('source-area').getBoundingClientRect();
        
        // 判斷是否丟回左下角垃圾桶區
        const isDroppedInSource = (
            dropX >= sourceAreaRect.left && dropX <= sourceAreaRect.right &&
            dropY >= sourceAreaRect.top && dropY <= sourceAreaRect.bottom
        );

        if (dragType === 'new') {
            // 從預備區新增積木到位值表
            if (targetZone && targetZone.id === `zone-${blockValue}`) {
                addBlock(blockValue);
            }
        } else if (dragType === 'move') {
            // 從位值表丟到垃圾桶
            if (isDroppedInSource) {
                draggedElement.remove(); // 徹底刪除
                playSound(400, 'square');
            } else {
                draggedElement.style.opacity = '1'; // 沒丟準，恢復原狀
            }
        }
        draggedElement = null;
    }

    function addBlock(val) {
        const newBlock = document.createElement('div');
        newBlock.className = `block block-${val}`;
        newBlock.setAttribute('data-value', val);
        document.getElementById(`container-${val}`).appendChild(newBlock);
        playSound(800, 'sine');
    }

    function breakTenBlock(block) {
        block.remove();
        for(let i=0; i<10; i++) addBlock('1');
        playSound(600, 'triangle');
    }

    // 簡易音效系統
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    // 彈出視窗控制
    function showModal(title, text, isSuccess) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-title').style.color = isSuccess ? '#27ae60' : '#e74c3c';
        document.getElementById('modal-text').innerText = text;
        document.getElementById('custom-modal').classList.add('active');
    }
    function closeModal() {
        document.getElementById('custom-modal').classList.remove('active');
    }

    // 檢查答案按鈕
    function checkAnswer() {
        const h = document.querySelectorAll('#container-100 .block-100').length;
        const t = document.querySelectorAll('#container-10 .block-10').length;
        const o = document.querySelectorAll('#container-1 .block-1').length;
        
        const total = h * 100 + t * 10 + o;
        
        if (total === 13) {
            playSound(1000, 'sine');
            showModal('恭喜答對！', '你成功拿走 10，把 23 變成了 13，太棒了！', true);
        } else {
            playSound(300, 'triangle');
            showModal('再試試看', `目前的積木總數是 ${total}，\n請操作積木，讓它變成 13 喔！`, false);
        }
    }
    
    // 提示按鈕
    function playHint() {
        playSound(700, 'sine');
        // 讓十位數區塊閃爍
        const zone10 = document.getElementById('zone-10');
        zone10.classList.remove('flash'); // 重置動畫
        void zone10.offsetWidth; // 觸發重繪
        zone10.classList.add('flash');
        
        showModal('溫馨提示', '題目要求「拿走 10」。\n請按住【十位】區域裡的 1 個綠色積木，拖曳到左下角的預備區丟掉！', true);
    }
</script>
</body>
</html>
