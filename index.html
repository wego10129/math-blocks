<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忍者道場大挑戰 - 鍵盤特訓</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            overflow: hidden;
            background-color: #1e293b; 
            color: white;
            margin: 0;
            padding: 0;
        }

        /* 背景滾動動畫 (純視覺，不影響遊戲邏輯) */
        @keyframes scrollBackground { from { background-position: 0 0; } to { background-position: -200px 0; } }
        .bg-scroll { animation: scrollBackground 2s linear infinite; }
        .bg-scroll-fast { animation: scrollBackground 1.2s linear infinite; }
        
        /* Shift 衝刺時背景加速 */
        body.is-dashing .bg-scroll { animation-duration: 0.3s !important; }
        body.is-dashing .bg-scroll-fast { animation-duration: 0.2s !important; }

        /* 虛擬鍵盤樣式優化 */
        #virtual-keyboard-container { width: 100%; max-width: 700px; margin: 0 auto; }
        .v-key {
            background: linear-gradient(to bottom, #475569, #334155);
            border: 2px solid #1e293b; border-bottom: 4px solid #0f172a; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            color: #cbd5e1; transition: all 0.05s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .v-key.active {
            transform: translateY(4px); border-bottom-width: 0px;
            background: linear-gradient(to bottom, #fcd34d, #f59e0b); color: #78350f;
            box-shadow: 0 0 15px rgba(252, 211, 77, 0.8);
        }
        .v-key.caps-active {
            background: linear-gradient(to bottom, #ef4444, #b91c1c); color: white; border-color: #fca5a5;
        }

        /* 遊戲畫布 */
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 20; /* 在背景之上，UI 之下 */
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- DOM 背景層 (純視覺) -->
    <div class="absolute inset-0 z-0 flex flex-col pointer-events-none">
        <div class="h-[75%] bg-slate-800 relative overflow-hidden">
            <div class="absolute bottom-0 w-full h-32 bg-slate-700 opacity-50" style="clip-path: polygon(0 100%, 100% 100%, 100% 40%, 80% 60%, 60% 20%, 40% 70%, 20% 30%, 0 50%);"></div>
            <div class="absolute top-10 right-20 text-6xl opacity-80">🌕</div>
            <div class="absolute bottom-0 w-full h-16 opacity-30 bg-scroll-fast" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 20px, #000 20px, #000 40px); background-size: 200px 100%;"></div>
        </div>
        <div class="h-[25%] bg-amber-900 border-t-8 border-amber-950 relative overflow-hidden">
            <div class="absolute top-0 w-full h-24 opacity-40 border-b-4 border-black bg-scroll" style="background-image: repeating-linear-gradient(90deg, #000, #000 10px, transparent 10px, transparent 60px); background-size: 60px 100%;"></div>
            <div class="absolute inset-0 opacity-30 bg-scroll" style="background-image: repeating-linear-gradient(90deg, transparent, transparent 98px, #000 98px, #000 100px); background-size: 100px 100%;"></div>
        </div>
    </div>

    <!-- HTML5 畫布 (遊戲本體) -->
    <canvas id="game-canvas"></canvas>

    <!-- UI 層: 狀態列 -->
    <div id="hud-layer" class="absolute top-4 left-4 z-30 hidden flex-col gap-2 pointer-events-none">
        <div class="bg-slate-900/90 p-4 rounded-2xl border-4 border-amber-500/50 shadow-2xl min-w-[250px]">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <div id="timer-display" class="text-4xl font-black text-amber-400">00:45</div>
                <div id="lives-display" class="text-3xl tracking-widest drop-shadow-md">❤️❤️❤️</div>
            </div>
            <div class="pt-2">
                <div class="text-xl font-bold text-slate-300">得分: <span id="score-display" class="text-emerald-400 text-3xl font-black">0</span></div>
            </div>
        </div>
        <!-- 退出按鈕 (需 pointer-events-auto) -->
        <button onclick="returnToMenu()" class="pointer-events-auto mt-2 px-4 py-2 bg-slate-700 text-white text-lg font-bold rounded-xl border-b-4 border-slate-900 hover:bg-slate-600 transition-all self-start">🚪 放棄試煉</button>
    </div>

    <!-- UI 層: 幻術干擾 (ESC) -->
    <div id="illusion-layer" class="absolute inset-0 bg-fuchsia-900/95 z-[40] hidden flex-col items-center justify-center backdrop-blur-md">
        <div class="text-[12rem] mb-4 animate-pulse drop-shadow-[0_0_50px_fuchsia]">😵‍💫</div>
        <h2 class="text-5xl font-black text-white text-center drop-shadow-lg">幻術干擾！失去視野！<br><span class="text-yellow-300 text-4xl mt-4 block">請在 3 秒內按下 ESC 鍵解除！</span></h2>
        <div id="illusion-timer" class="w-1/2 h-8 bg-slate-800 rounded-full mt-8 border-4 border-white overflow-hidden">
            <div class="h-full bg-fuchsia-500 w-full transition-all duration-[3000ms] ease-linear"></div>
        </div>
    </div>

    <!-- UI 層: 飯糰補血事件 (方向鍵) -->
    <div id="heal-event-layer" class="absolute inset-0 bg-slate-900/90 z-[40] hidden flex-col items-center justify-center backdrop-blur-sm">
        <h2 class="text-5xl font-black text-amber-400 text-center drop-shadow-lg mb-8 animate-bounce">🍙 快速輸入指令吃飯糰！</h2>
        <div id="heal-sequence" class="flex gap-6 mb-8">
            <!-- 從 JS 動態生成 -->
        </div>
        <div id="heal-event-timer" class="w-1/3 h-6 bg-slate-800 rounded-full border-2 border-white overflow-hidden">
            <div class="h-full bg-amber-500 w-full transition-all duration-[4000ms] ease-linear"></div>
        </div>
    </div>

    <!-- 虛擬鍵盤 (只在遊戲中顯示) -->
    <div id="virtual-keyboard" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-40 bg-slate-900/80 p-4 rounded-3xl backdrop-blur-md border-2 border-slate-700/50 hidden">
        <div class="text-center text-slate-400 text-xs mb-3 font-bold tracking-widest">【 鍵盤指示器 (請操作您的實體鍵盤) 】</div>
        <div id="virtual-keyboard-container" class="flex flex-col gap-3">
            <div class="flex justify-between w-full">
                <div id="vk-esc" class="v-key w-16 h-12 text-sm">ESC</div>
                <div id="vk-backspace" class="v-key w-32 h-12 text-sm">Backspace ⟵</div>
            </div>
            <div class="flex justify-between w-full pl-4">
                <div id="vk-caps" class="v-key w-28 h-12 text-sm border-2 border-slate-600">Caps Lock</div>
                <div class="flex-grow"></div>
                <div id="vk-enter" class="v-key w-36 h-12 text-sm">Enter ↵</div>
            </div>
            <div class="flex justify-start w-full pl-8">
                <div id="vk-shift" class="v-key w-36 h-12 text-sm">Shift ⇧</div>
            </div>
            <div class="flex justify-between w-full pl-12 items-end">
                <div class="flex gap-4">
                    <div id="vk-ctrl" class="v-key w-24 h-12 text-sm">Ctrl</div>
                    <div id="vk-space" class="v-key w-72 h-12 text-base font-black text-slate-300">Space (空白鍵)</div>
                </div>
                <div class="flex flex-col gap-1 ml-4">
                    <div class="flex justify-center"><div id="vk-up" class="v-key w-14 h-12 text-lg">↑</div></div>
                    <div class="flex gap-1">
                        <div id="vk-left" class="v-key w-14 h-12 text-lg">←</div>
                        <div id="vk-down" class="v-key w-14 h-12 text-lg">↓</div>
                        <div id="vk-right" class="v-key w-14 h-12 text-lg">→</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主選單 -->
    <div id="screen-menu" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-slate-900/90 backdrop-blur-sm">
        <h1 class="text-6xl font-black text-white mb-4 drop-shadow-2xl text-center leading-tight tracking-wider">🥷 忍者道場大挑戰</h1>
        <p class="text-amber-400 text-2xl font-bold mb-12 drop-shadow-md bg-black/40 px-8 py-3 rounded-full border border-amber-500/50">鍵盤控制鍵：反射神經特訓</p>
        
        <div id="caps-lock-warning-menu" class="bg-red-900/90 border-2 border-red-500 text-white p-4 rounded-xl mb-8 text-center animate-pulse hidden">
            <span class="text-2xl block mb-1">⚠️ 請先關閉 Caps Lock！</span>
            <span class="text-lg">您的實體鍵盤目前亮著大小寫鎖定燈，請按一下關閉它再開始。</span>
        </div>

        <button id="btn-start" onclick="showChallengeSetup()" class="px-12 py-6 bg-amber-600 text-white text-4xl font-bold rounded-3xl border-b-8 border-amber-800 hover:scale-105 active:translate-y-2 active:border-b-0 transition-all shadow-xl">⚔️ 進入道場</button>
    </div>

    <!-- 挑戰設定 -->
    <div id="screen-setup" class="absolute inset-0 hidden flex-col items-center justify-center z-50 bg-slate-900/95 backdrop-blur-md">
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-2xl w-full border-4 border-slate-600 relative">
            <button onclick="returnToMenu()" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 text-4xl font-bold">&times;</button>
            <h2 class="text-4xl font-black text-amber-500 mb-6 text-center border-b-2 border-slate-700 pb-4">實戰試煉設定</h2>
            
            <div class="mb-6">
                <p class="text-xl font-bold text-slate-300 mb-4 text-center">選擇生存時間</p>
                <div class="flex gap-4 justify-center">
                    <button id="btn-time-45" onclick="selectTime(45)" class="px-8 py-3 bg-blue-600 ring-4 ring-blue-400 text-white text-xl font-bold rounded-xl transition-all">45秒</button>
                    <button id="btn-time-90" onclick="selectTime(90)" class="px-8 py-3 bg-slate-700 text-slate-300 text-xl font-bold rounded-xl transition-all">90秒</button>
                </div>
            </div>
            <div class="mb-8">
                <p class="text-xl font-bold text-slate-300 mb-4 text-center">選擇難度 (機關速度)</p>
                <div class="flex gap-4 justify-center">
                    <button onclick="selectDifficulty('easy')" id="btn-diff-easy" class="px-8 py-3 bg-slate-700 text-slate-300 text-xl font-bold rounded-xl transition-all">見習 (慢)</button>
                    <button onclick="selectDifficulty('medium')" id="btn-diff-medium" class="px-8 py-3 bg-red-600 ring-4 ring-red-400 text-white text-xl font-bold rounded-xl transition-all">中忍 (中)</button>
                    <button onclick="selectDifficulty('hard')" id="btn-diff-hard" class="px-8 py-3 bg-slate-700 text-slate-300 text-xl font-bold rounded-xl transition-all">上忍 (快)</button>
                </div>
            </div>
            <div class="flex justify-center mt-4">
                <button onclick="startGame()" class="px-16 py-4 bg-emerald-500 text-white text-3xl font-black rounded-2xl shadow-xl border-b-8 border-emerald-700 active:border-b-0 active:translate-y-2 transition-all">開始生存戰</button>
            </div>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="screen-result" class="absolute inset-0 hidden flex-col items-center justify-center z-50 bg-slate-900/95 backdrop-blur-md">
        <div class="bg-slate-800 p-12 rounded-[3rem] shadow-2xl flex flex-col items-center border-8 border-amber-500 max-w-lg w-full text-center relative overflow-hidden">
            <div class="text-8xl mb-4" id="result-emoji">📜</div>
            <h2 id="result-title" class="text-5xl font-black text-amber-400 mb-4">試煉結束</h2>
            <p class="text-2xl text-slate-300 mb-8">總得分：<span id="result-score" class="text-emerald-400 font-black text-6xl ml-2 drop-shadow-lg">0</span></p>
            <p id="result-msg" class="text-xl font-bold text-slate-400 mb-10">繼續修煉吧！</p>
            <button onclick="returnToMenu()" class="px-10 py-5 bg-amber-500 text-amber-950 text-3xl font-bold rounded-2xl border-b-8 border-amber-700 active:translate-y-2 active:border-b-0 transition-all shadow-xl">🏠 回到道場大廳</button>
        </div>
    </div>

    <script>
        // --- 核心變數與 Canvas 設定 ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let canvasW, canvasH, groundY;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvasW = canvas.width;
            canvasH = canvas.height;
            groundY = canvasH * 0.75; // 地板高度在畫面的 75% 處
        }
        window.addEventListener('resize', resize);
        resize();

        // 遊戲 UI 參照
        const ui = {
            menu: document.getElementById('screen-menu'),
            setup: document.getElementById('screen-setup'),
            result: document.getElementById('screen-result'),
            hud: document.getElementById('hud-layer'),
            keyboard: document.getElementById('virtual-keyboard'),
            illusion: document.getElementById('illusion-layer'),
            healEvent: document.getElementById('heal-event-layer')
        };

        const keyMap = {
            'Escape': 'vk-esc', 'Backspace': 'vk-backspace', 'Enter': 'vk-enter',
            'Space': 'vk-space', 'ShiftLeft': 'vk-shift', 'ShiftRight': 'vk-shift',
            'ControlLeft': 'vk-ctrl', 'ControlRight': 'vk-ctrl', 'CapsLock': 'vk-caps',
            'ArrowUp': 'vk-up', 'ArrowDown': 'vk-down', 'ArrowLeft': 'vk-left', 'ArrowRight': 'vk-right'
        };
        const arrowSymbols = { 'ArrowUp': '↑', 'ArrowDown': '↓', 'ArrowLeft': '←', 'ArrowRight': '→' };

        // 遊戲狀態與設定
        let gameState = 'menu'; // menu, playing, illusion, healEvent, gameover
        let config = { duration: 45, difficulty: 'medium' };
        let state = {
            score: 0, timeLeft: 0, lives: 3, 
            lastTime: 0, spawnTimer: 0,
            capsLockOn: false
        };

        // 遊戲實體陣列
        let ninja;
        let obstacles = [];
        let particles = [];
        let texts = []; // 漂浮文字 (分數/傷害)
        let activeTimeouts = []; // 管理非 Canvas 的 DOM timeout

        // --- STREAMING_CHUNK:Defining Game Classes (Ninja)... ---
        class Ninja {
            constructor() {
                this.size = Math.min(canvasW, canvasH) * 0.15; // 根據螢幕動態調整大小
                this.x = canvasW * 0.2; // 固定在畫面左側 20% 處
                this.y = groundY - this.size;
                this.vy = 0;
                this.gravity = this.size * 0.04;
                this.jumpForce = this.size * 0.6;
                this.isGrounded = true;
                
                // 狀態機
                this.isCrouching = false;
                this.isDashing = false;
                this.isGiant = false;
                this.attackTimer = 0;
                this.attackDir = 0; // -1 back, 1 forward
                this.flashTimer = 0; // 受傷閃爍
            }

            update(dt) {
                // 套用重力 (如果沒有巨大化)
                if (!this.isGiant) {
                    this.vy += this.gravity * (dt/16);
                    this.y += this.vy * (dt/16);
                }

                let currentSize = this.isGiant ? this.size * 2 : this.size;
                let bottomLimit = groundY - currentSize;

                // 地板碰撞
                if (this.y >= bottomLimit) {
                    this.y = bottomLimit;
                    this.vy = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }

                // 更新計時器
                if (this.attackTimer > 0) this.attackTimer -= dt;
                if (this.flashTimer > 0) this.flashTimer -= dt;
            }

            draw(ctx) {
                if (this.flashTimer > 0 && Math.floor(this.flashTimer / 50) % 2 === 0) return; // 閃爍效果

                ctx.save();
                let drawX = this.x;
                let drawY = this.y;
                let currentSize = this.isGiant ? this.size * 2 : this.size;
                
                // 處理中心點與變形
                ctx.translate(drawX + currentSize/2, drawY + currentSize); // 移至底部中心

                if (this.isGiant) {
                    ctx.filter = 'drop-shadow(0 0 20px red)';
                } else if (this.isCrouching) {
                    ctx.scale(1, 0.4); // 蹲下變扁
                } else if (this.isDashing) {
                    ctx.transform(1, 0, -0.3, 1, 0, 0); // 衝刺前傾
                    ctx.filter = 'drop-shadow(-20px 0 10px cyan)';
                }

                if (this.attackTimer > 0) {
                    if (this.attackDir === -1) {
                        ctx.scale(-1.2, 1.2); // 往後攻擊
                    } else if (this.attackDir === 1) {
                        ctx.scale(1.2, 1.2); // 往前攻擊
                        ctx.filter = 'drop-shadow(0 0 10px yellow) brightness(1.5)';
                    }
                }

                ctx.font = `${currentSize}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('🥷', 0, 0);
                ctx.restore();
            }

            // 取得精準的碰撞判定框 (Bounding Box)
            getHitbox() {
                let currentSize = this.isGiant ? this.size * 2 : this.size;
                let h = this.isCrouching && !this.isGiant ? currentSize * 0.4 : currentSize;
                let w = currentSize * 0.6; // 左右內縮，給予玩家寬容度
                let currentY = this.isCrouching && !this.isGiant ? this.y + (currentSize * 0.6) : this.y;
                
                return {
                    x: this.x + (currentSize - w) / 2,
                    y: currentY,
                    w: w,
                    h: h
                };
            }
        }

        // --- STREAMING_CHUNK:Defining Game Classes (Obstacles)... ---
        class Obstacle {
            constructor(type, speed) {
                this.type = type;
                this.size = ninja.size * 0.8;
                this.active = true;
                this.passed = false; // 是否已安全通過玩家
                
                // 根據難度設定基本速度，若玩家 Dash 則視覺上更快
                this.baseSpeed = speed; 
                
                // 設定各類型屬性
                if (type === 'log') { // 空白鍵跳
                    this.icon = '🪵'; this.x = canvasW; this.y = groundY - this.size;
                } else if (type === 'shuriken') { // Ctrl 蹲
                    this.icon = '🪃'; this.x = canvasW; this.y = groundY - ninja.size * 1.1; // 剛好在站立頭部高度
                } else if (type === 'wolf') { // Backspace 後擊
                    this.icon = '🐺'; this.x = -this.size; this.y = groundY - this.size;
                    this.baseSpeed = speed * 0.8; // 狼從後面來，慢一點
                } else if (type === 'gate') { // Enter 前劈
                    this.icon = '⛩️'; this.x = canvasW; this.y = groundY - this.size;
                } else if (type === 'wall') { // Shift 撞破
                    this.icon = '🧱'; this.x = canvasW; this.y = groundY - this.size;
                } else if (type === 'monster') { // Caps Lock 變大撞
                    this.icon = '👹'; this.x = canvasW; this.size = ninja.size * 1.5; this.y = groundY - this.size;
                }
                this.angle = 0;
            }

            update(dt) {
                // 如果忍者在 Dash，背景與障礙物相對速度大幅提升 (除了後方來的狼)
                let currentSpeed = this.baseSpeed;
                if (ninja.isDashing && this.type !== 'wolf') {
                    currentSpeed = this.baseSpeed * 2.5; 
                }

                if (this.type === 'wolf') {
                    this.x += currentSpeed * (dt/16);
                } else {
                    this.x -= currentSpeed * (dt/16);
                }

                if (this.type === 'shuriken') this.angle += 0.2 * (dt/16);

                // 檢查是否飛出畫面
                if (this.type === 'wolf' && this.x > canvasW + this.size) this.active = false;
                else if (this.type !== 'wolf' && this.x < -this.size) this.active = false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.size/2, this.y + this.size/2);
                if (this.type === 'shuriken') ctx.rotate(this.angle);
                if (this.type === 'wolf') ctx.scale(-1, 1); // 狼朝右看
                
                if (this.type === 'monster') ctx.filter = 'drop-shadow(0 0 10px red)';

                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.icon, 0, 0);
                ctx.restore();
            }

            getHitbox() {
                // 障礙物碰撞框稍微內縮 20% 給予玩家極大的寬容度 (Hitbox Lenience)
                let padding = this.size * 0.2;
                return {
                    x: this.x + padding,
                    y: this.y + padding,
                    w: this.size - padding * 2,
                    h: this.size - padding * 2
                };
            }
        }

        // --- STREAMING_CHUNK:Defining Utility Classes (Particles & Text)... ---
        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y;
                this.text = text; this.color = color;
                this.life = 1.0; this.vy = -2;
            }
            update(dt) {
                this.y += this.vy * (dt/16);
                this.life -= 0.02 * (dt/16);
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = `bold ${canvasH * 0.05}px 'Noto Sans TC'`;
                ctx.fillStyle = this.color;
                ctx.textAlign = 'center';
                ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, emoji) {
                this.x = x; this.y = y; this.emoji = emoji;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 1) * 10;
                this.life = 1.0;
                this.size = canvasH * 0.05;
            }
            update(dt) {
                this.x += this.vx * (dt/16);
                this.y += this.vy * (dt/16);
                this.vy += 0.5 * (dt/16); // gravity
                this.life -= 0.05 * (dt/16);
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = `${this.size}px sans-serif`;
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        // --- STREAMING_CHUNK:Input Handling & Physics Logic... ---
        
        // Caps Lock 偵測與 UI 更新
        function checkCapsLock(e) {
            if (e.getModifierState) {
                let isOn = e.getModifierState('CapsLock');
                state.capsLockOn = isOn;
                
                const capKey = document.getElementById('vk-caps');
                if (isOn) capKey.classList.add('caps-active');
                else capKey.classList.remove('caps-active');

                // 若在遊戲中，同步更新忍者巨大化狀態
                if (gameState === 'playing' && ninja) {
                    ninja.isGiant = isOn;
                }

                // 選單防呆提示
                const menuWarning = document.getElementById('caps-lock-warning-menu');
                const startBtn = document.getElementById('btn-start');
                if (gameState === 'menu') {
                    if (isOn) {
                        menuWarning.classList.remove('hidden');
                        startBtn.disabled = true; startBtn.classList.add('opacity-50');
                    } else {
                        menuWarning.classList.add('hidden');
                        startBtn.disabled = false; startBtn.classList.remove('opacity-50');
                    }
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].includes(e.code)) e.preventDefault();
            
            checkCapsLock(e);
            
            // 點亮虛擬鍵盤
            const vkId = keyMap[e.code];
            if (vkId) { const el = document.getElementById(vkId); if (el && e.code !== 'CapsLock') el.classList.add('active'); }

            if (gameState === 'healEvent' && Object.keys(arrowSymbols).includes(e.code)) {
                handleHealInput(e.code);
                return;
            }

            if (gameState === 'playing' && ninja) {
                if (e.code === 'Space' && !ninja.isGiant && ninja.isGrounded) {
                    ninja.vy = -ninja.jumpForce;
                    ninja.isGrounded = false;
                } 
                else if ((e.code === 'ControlLeft' || e.code === 'ControlRight') && !ninja.isGiant) {
                    ninja.isCrouching = true;
                }
                else if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !ninja.isGiant) {
                    ninja.isDashing = true;
                    document.body.classList.add('is-dashing');
                }
                else if (e.code === 'Backspace') {
                    ninja.attackTimer = 200; ninja.attackDir = -1;
                    checkActiveAttack('wolf', -1);
                }
                else if (e.code === 'Enter' || e.code === 'NumpadEnter') {
                    ninja.attackTimer = 200; ninja.attackDir = 1;
                    checkActiveAttack('gate', 1);
                }
            }
            
            if (gameState === 'illusion' && e.code === 'Escape') {
                clearIllusion(true);
            }
        });

        document.addEventListener('keyup', (e) => {
            checkCapsLock(e);
            const vkId = keyMap[e.code];
            if (vkId) { const el = document.getElementById(vkId); if (el && e.code !== 'CapsLock') el.classList.remove('active'); }

            if (gameState === 'playing' && ninja) {
                if (e.code === 'ControlLeft' || e.code === 'ControlRight') {
                    ninja.isCrouching = false;
                }
                else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                    ninja.isDashing = false;
                    document.body.classList.remove('is-dashing');
                }
            }
        });

        // 矩形碰撞檢測 (AABB)
        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || 
                     r2.x + r2.w < r1.x || 
                     r2.y > r1.y + r1.h ||
                     r2.y + r2.h < r1.y);
        }

        // 處理主動攻擊的判定 (Enter 往前 / Backspace 往後)
        function checkActiveAttack(targetType, direction) {
            let nBox = ninja.getHitbox();
            let attackRange = canvasW * 0.3; // 攻擊距離

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                if (!obs.active || obs.type !== targetType) continue;

                let oBox = obs.getHitbox();
                
                // 檢查是否在攻擊範圍內
                let inRange = false;
                if (direction === 1 && oBox.x > nBox.x && (oBox.x - (nBox.x + nBox.w)) < attackRange) inRange = true; // 前方
                if (direction === -1 && oBox.x < nBox.x && (nBox.x - (oBox.x + oBox.w)) < attackRange) inRange = true; // 後方

                if (inRange) {
                    obs.active = false;
                    spawnParticles(obs.x + obs.size/2, obs.y + obs.size/2, '💥');
                    addScore(30, obs.x, obs.y - 50);
                }
            }
        }

        function takeDamage(reasonText) {
            state.lives--;
            updateHUD();
            ninja.flashTimer = 800; // 受傷無敵/閃爍 0.8 秒
            texts.push(new FloatingText(ninja.x + ninja.size/2, ninja.y - 50, '-1 ❤️', '#ef4444'));
            if (reasonText) texts.push(new FloatingText(canvasW/2, canvasH/3, reasonText, '#ef4444'));

            if (state.lives <= 0) {
                setTimeout(() => endGame(false), 500);
            }
        }

        function addScore(pts, x, y) {
            state.score += pts;
            updateHUD();
            texts.push(new FloatingText(x || canvasW/2, y || ninja.y - 50, `+${pts}`, '#10b981'));
            
            const sd = document.getElementById('score-display');
            sd.classList.add('scale-150', 'text-yellow-400');
            setTimeout(() => sd.classList.remove('scale-150', 'text-yellow-400'), 300);
        }

        function spawnParticles(x, y, emoji) {
            for(let i=0; i<3; i++) particles.push(new Particle(x, y, emoji));
        }

        // --- STREAMING_CHUNK:Core Game Loop & Spawning Logic... ---
        
        function gameLoop(timestamp) {
            if (!state.lastTime) state.lastTime = timestamp;
            const dt = timestamp - state.lastTime;
            state.lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製基準地板線 (測試用，可隱藏，實際由 CSS 背景負責視覺)
            // ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvasW, groundY);
            // ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.stroke();

            if (gameState === 'playing' || gameState === 'illusion' || gameState === 'healEvent') {
                
                // 更新與繪製忍者
                if (ninja) {
                    if (gameState === 'playing') ninja.update(dt);
                    ninja.draw(ctx);
                }

                // 遊戲進行中才更新障礙物與生成邏輯
                if (gameState === 'playing') {
                    
                    // 生成邏輯
                    state.spawnTimer += dt;
                    let spawnRate = config.difficulty === 'easy' ? 3000 : (config.difficulty === 'hard' ? 1500 : 2200);
                    if (ninja.isDashing) spawnRate *= 0.5; // 衝刺時生怪變快

                    if (state.spawnTimer > spawnRate) {
                        state.spawnTimer = 0;
                        spawnRandomEvent();
                    }

                    let nBox = ninja.getHitbox();

                    // 更新障礙物與碰撞檢測
                    for (let i = obstacles.length - 1; i >= 0; i--) {
                        let obs = obstacles[i];
                        obs.update(dt);
                        obs.draw(ctx);

                        if (!obs.active) {
                            obstacles.splice(i, 1);
                            continue;
                        }

                        let oBox = obs.getHitbox();
                        
                        // 碰撞判定 (精準 AABB 交疊)
                        if (rectIntersect(nBox, oBox)) {
                            // 檢查是否有正確的應對狀態
                            if (obs.type === 'wall' && ninja.isDashing) {
                                obs.active = false; addScore(30, obs.x, obs.y); spawnParticles(obs.x, obs.y, '💥');
                            }
                            else if (obs.type === 'monster' && ninja.isGiant) {
                                obs.active = false; addScore(50, obs.x, obs.y); spawnParticles(obs.x, obs.y, '💥');
                            }
                            else {
                                // 真實碰撞受傷 (若沒有在無敵閃爍時間)
                                if (ninja.flashTimer <= 0) {
                                    obs.active = false; // 撞到就消失
                                    takeDamage();
                                }
                            }
                        } 
                        else if (!obs.passed) {
                            // 判斷是否安全閃避通過
                            if ((obs.type !== 'wolf' && oBox.x + oBox.w < nBox.x) || 
                                (obs.type === 'wolf' && oBox.x > nBox.x + nBox.w)) {
                                obs.passed = true;
                                addScore(10, ninja.x, ninja.y - 80);
                            }
                        }
                    }
                } else if (gameState === 'healEvent' || gameState === 'illusion') {
                    // 事件暫停期間，障礙物只畫不更新
                    obstacles.forEach(obs => obs.draw(ctx));
                }

                // 特效更新與繪製
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update(dt); particles[i].draw(ctx);
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
                for (let i = texts.length - 1; i >= 0; i--) {
                    texts[i].update(dt); texts[i].draw(ctx);
                    if (texts[i].life <= 0) texts.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // --- STREAMING_CHUNK:Event Systems (Spawning, Illusion, Heal)... ---
        
        function spawnRandomEvent() {
            let rand = Math.random();
            
            // 幻術事件 (10%)
            if (rand < 0.1) { triggerIllusion(); return; }

            // 補血事件 (殘血時高機率觸發)
            let healChance = (state.lives < 3) ? 0.2 : 0.02;
            if (rand > 0.8 && Math.random() < healChance && obstacles.length === 0) {
                triggerHealEvent(); return;
            }
            
            // 一般障礙物
            const types = ['log', 'shuriken', 'wolf', 'gate', 'wall', 'monster'];
            let chosen = types[Math.floor(Math.random() * types.length)];
            let speed = canvasW * 0.003; // 基礎像素速度
            
            obstacles.push(new Obstacle(chosen, speed));
        }

        function triggerIllusion() {
            gameState = 'illusion';
            ui.illusion.classList.remove('hidden');
            const timerBar = document.getElementById('illusion-timer').firstElementChild;
            timerBar.style.transition = 'none'; timerBar.style.width = '100%';
            setTimeout(() => { timerBar.style.transition = 'width 3s linear'; timerBar.style.width = '0%'; }, 50);

            let tId = setTimeout(() => {
                if (gameState === 'illusion') clearIllusion(false);
            }, 3000);
            activeTimeouts.push(tId);
        }

        function clearIllusion(success) {
            ui.illusion.classList.add('hidden');
            if (success) { addScore(20, canvasW/2, canvasH/2); texts.push(new FloatingText(canvasW/2, canvasH/2 - 50, '幻術破除!', '#10b981')); }
            else { takeDamage("幻術未解除"); }
            
            // 稍微停頓後恢復遊戲
            let tId = setTimeout(() => { if (state.lives > 0) gameState = 'playing'; }, 500);
            activeTimeouts.push(tId);
        }

        let healTarget = [], healIndex = 0;
        function triggerHealEvent() {
            gameState = 'healEvent';
            healIndex = 0; healTarget = [];
            const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
            for(let i=0; i<3; i++) healTarget.push(keys[Math.floor(Math.random() * keys.length)]);
            
            ui.healEvent.classList.remove('hidden');
            const seqContainer = document.getElementById('heal-sequence');
            seqContainer.innerHTML = healTarget.map((k, i) => 
                `<div id="hk-${i}" class="w-20 h-20 bg-slate-700 border-4 border-slate-500 rounded-2xl flex items-center justify-center text-5xl text-white font-bold transition-all shadow-lg">${arrowSymbols[k]}</div>`
            ).join('');

            const timerBar = document.getElementById('heal-event-timer').firstElementChild;
            timerBar.style.transition = 'none'; timerBar.style.width = '100%';
            setTimeout(() => { timerBar.style.transition = 'width 4s linear'; timerBar.style.width = '0%'; }, 50);

            let tId = setTimeout(() => {
                if (gameState === 'healEvent') {
                    ui.healEvent.classList.add('hidden');
                    gameState = 'playing'; // 失敗不扣血直接恢復
                }
            }, 4000);
            activeTimeouts.push(tId);
        }

        function handleHealInput(code) {
            if (code === healTarget[healIndex]) {
                const keyEl = document.getElementById(`hk-${healIndex}`);
                keyEl.classList.replace('bg-slate-700', 'bg-emerald-500');
                keyEl.classList.replace('border-slate-500', 'border-emerald-300');
                keyEl.classList.add('scale-110');
                healIndex++;
                
                if (healIndex === 3) {
                    if (state.lives < 3) { state.lives++; updateHUD(); texts.push(new FloatingText(canvasW/2, canvasH/2, '+1 ❤️', '#10b981')); }
                    addScore(50, canvasW/2, canvasH/2 + 50);
                    
                    setTimeout(() => {
                        ui.healEvent.classList.add('hidden');
                        if (state.lives > 0) gameState = 'playing';
                    }, 500);
                }
            } else {
                ui.healEvent.classList.add('hidden');
                gameState = 'playing';
            }
        }

        // --- STREAMING_CHUNK:Game State Management (Start, HUD, End)... ---
        
        let timerInterval;

        function updateHUD() {
            let hearts = ''; for(let i=0; i<3; i++) hearts += (i < state.lives) ? '❤️' : '🖤';
            document.getElementById('lives-display').textContent = hearts;
            document.getElementById('score-display').textContent = state.score;
            document.getElementById('timer-display').textContent = `00:${state.timeLeft.toString().padStart(2, '0')}`;
        }

        function selectTime(seconds) {
            config.duration = seconds;
            document.getElementById('btn-time-45').className = seconds === 45 ? "px-8 py-3 bg-blue-600 ring-4 ring-blue-400 text-white text-xl font-bold rounded-xl transition-all" : "px-8 py-3 bg-slate-700 text-slate-300 text-xl font-bold rounded-xl transition-all";
            document.getElementById('btn-time-90').className = seconds === 90 ? "px-8 py-3 bg-blue-600 ring-4 ring-blue-400 text-white text-xl font-bold rounded-xl transition-all" : "px-8 py-3 bg-slate-700 text-slate-300 text-xl font-bold rounded-xl transition-all";
        }

        function selectDifficulty(level) {
            config.difficulty = level;
            ['easy', 'medium', 'hard'].forEach(diff => {
                const btn = document.getElementById(`btn-diff-${diff}`);
                btn.className = diff === level ? "px-8 py-3 bg-red-600 ring-4 ring-red-400 text-white text-xl font-bold rounded-xl transition-all" : "px-8 py-3 bg-slate-700 text-slate-300 text-xl font-bold rounded-xl transition-all";
            });
        }

        function showChallengeSetup() {
            ui.menu.classList.add('hidden');
            ui.setup.classList.remove('hidden'); ui.setup.classList.add('flex');
            
            // Check Caps Lock on setup
            if (state.capsLockOn) {
                document.getElementById('caps-lock-warning-menu').classList.remove('hidden');
            }
        }

        function startGame() {
            if (state.capsLockOn) { alert("請先關閉實體鍵盤的 Caps Lock 再開始遊戲！"); return; }
            
            // Reset state
            state = { score: 0, timeLeft: config.duration, lives: 3, lastTime: 0, spawnTimer: 0, capsLockOn: false };
            ninja = new Ninja();
            obstacles = []; particles = []; texts = [];
            
            ui.setup.classList.remove('flex'); ui.setup.classList.add('hidden');
            ui.hud.classList.remove('hidden'); ui.hud.classList.add('flex');
            ui.keyboard.classList.remove('hidden');
            
            updateHUD();
            gameState = 'playing';

            // Global timer
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'playing' || gameState === 'illusion' || gameState === 'healEvent') {
                    state.timeLeft--; updateHUD();
                    if (state.timeLeft <= 0) endGame(true);
                }
            }, 1000);
        }

        function endGame(isWin) {
            gameState = 'gameover';
            clearInterval(timerInterval);
            activeTimeouts.forEach(clearTimeout); activeTimeouts = [];
            document.body.classList.remove('is-dashing');

            ui.hud.classList.add('hidden'); ui.hud.classList.remove('flex');
            ui.keyboard.classList.add('hidden');
            ui.illusion.classList.add('hidden');
            ui.healEvent.classList.add('hidden');
            
            ui.result.classList.remove('hidden'); ui.result.classList.add('flex');
            
            document.getElementById('result-score').textContent = state.score;
            const titleEl = document.getElementById('result-title');
            const msgEl = document.getElementById('result-msg');
            const emojiEl = document.getElementById('result-emoji');
            
            if (!isWin) {
                titleEl.textContent = "任務失敗"; titleEl.classList.replace('text-amber-400', 'text-red-500');
                msgEl.textContent = "生命值歸零了！反應還不夠快，再練練吧！"; emojiEl.innerHTML = '☠️';
            } else {
                titleEl.textContent = "試煉完成"; titleEl.classList.replace('text-red-500', 'text-amber-400');
                if (state.score >= 500) { msgEl.textContent = "太神啦！你是傳說中的鍵盤火影！"; emojiEl.innerHTML = '👑'; } 
                else { msgEl.textContent = "成功存活！繼續努力修煉，一定會越來越快！"; emojiEl.innerHTML = '💪'; }
            }
        }

        function returnToMenu() {
            gameState = 'menu';
            clearInterval(timerInterval);
            activeTimeouts.forEach(clearTimeout); activeTimeouts = [];
            document.body.classList.remove('is-dashing');
            
            ui.setup.classList.remove('flex'); ui.setup.classList.add('hidden');
            ui.result.classList.remove('flex'); ui.result.classList.add('hidden');
            ui.hud.classList.remove('flex'); ui.hud.classList.add('hidden');
            ui.keyboard.classList.add('hidden');
            ui.illusion.classList.add('hidden');
            ui.healEvent.classList.add('hidden');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height); // clear canvas
            ui.menu.classList.remove('hidden');
        }

        // 啟動迴圈
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
