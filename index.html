<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>位值積木操作</title>
    <style>
        body { 
            margin: 0; font-family: '微軟正黑體', sans-serif; background-color: #f4f7f9; 
            touch-action: none; /* 防止 iOS Safari 原生捲動 */
            user-select: none; /* 防止文字反白 */
            -webkit-user-select: none;
            overflow: hidden; /* 防止整個畫面被拖動 */
        }
        .header { text-align: center; padding: 20px 0; }
        .title { font-size: 28px; font-weight: bold; color: #333; }
        .subtitle { font-size: 18px; color: #7f8c8d; margin-top: 5px; }

        .board { display: flex; justify-content: center; gap: 20px; padding: 10px; }
        .zone { width: 220px; height: 380px; border: 3px solid; border-radius: 10px; background: white; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        .zone-hundreds { border-color: #ff9999; }
        .zone-tens { border-color: #99e6cc; }
        .zone-ones { border-color: #ffeba8; }
        
        .zone-title { padding: 5px 20px; color: white; border-radius: 5px; margin-top: -15px; font-weight: bold; font-size: 20px;}
        .zone-hundreds .zone-title { background-color: #ff6666; }
        .zone-tens .zone-title { background-color: #4dc3a3; }
        .zone-ones .zone-title { background-color: #f1c40f; }

        .hint-text { font-size: 12px; color: #bdc3c7; margin-top: 10px; pointer-events: none; }

        /* 基礎積木樣式 */
        .block {
            cursor: grab;
            touch-action: none;
            -webkit-user-drag: none; /* 絕對防止瀏覽器原生拖曳出現禁止符號 */
            user-select: none;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            position: relative;
        }
        .block:active { cursor: grabbing; }
        
        /* 1的積木 (20x20 正方形) */
        .block-1 { 
            width: 20px; height: 20px; 
            background-color: #f1c40f; 
            border: 1px solid #d4ac0d; 
            border-radius: 2px;
            box-sizing: border-box;
        }
        
        /* 10的積木 (20x200，由10個完美正方形組成) */
        .block-10 { 
            width: 20px; height: 200px; 
            background-color: #4dc3a3; 
            border: 1px solid #1abc9c; 
            border-radius: 2px;
            box-sizing: border-box;
            /* 利用漸層畫出完美的 20px 正方形分隔線 */
            background-image: linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 100的積木 (200x200，由10x10完美正方形組成) */
        .block-100 { 
            width: 200px; height: 200px; 
            background-color: #ff6666; 
            border: 1px solid #e74c3c; 
            border-radius: 2px;
            box-sizing: border-box;
            /* 畫出 10x10 的網格線 */
            background-image: 
                linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
            background-size: 20px 20px, 20px 20px;
        }

        /* 百位數容器 (層疊放) */
        #container-100 {
            position: relative; width: 100%; height: 100%; padding-top: 20px; display: flex; justify-content: center;
        }
        #container-100 .block-100 { position: absolute; }
        #container-100 .block-100:nth-child(1) { top: 20px; left: 8px; }
        #container-100 .block-100:nth-child(2) { top: 35px; left: 15px; } /* 如果有兩個100，製造堆疊感 */

        /* 十位數容器 (橫向排列) */
        #container-10 {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 20px 10px; width: 100%; box-sizing: border-box;
        }

        /* 個位數容器 (十格陣) */
        .ten-frame-wrapper { position: relative; padding-top: 20px; }
        .ten-frame-bg {
            display: grid; grid-template-columns: repeat(2, 20px); grid-template-rows: repeat(5, 20px); gap: 5px; opacity: 0.5;
        }
        .ten-frame-bg .slot { width: 20px; height: 20px; border: 2px dashed #bdc3c7; border-radius: 2px; box-sizing: border-box; }
        
        #container-1 {
            display: grid; grid-template-columns: repeat(2, 20px); grid-auto-rows: 20px; gap: 5px; 
            position: absolute; top: 20px; left: 0; z-index: 2;
        }

        /* 底部與預備區 */
        .footer { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: white; border-top: 2px solid #ecf0f1; position: fixed; bottom: 0; width: 100%; box-sizing: border-box;}
        
        .source-area { display: flex; gap: 30px; align-items: flex-end; padding: 10px 20px; border: 2px dashed #bdc3c7; border-radius: 10px; background-color: #f8f9fa; }
        .source-item { display: flex; flex-direction: column; align-items: center; cursor: grab; touch-action: none; -webkit-user-drag: none; }
        .source-label { font-size: 14px; color: #7f8c8d; margin-top: 8px; font-weight: bold; }
        
        /* 預備區的縮小版圖示 */
        .source-icon { border-radius: 2px; box-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
        .icon-100 { width: 50px; height: 50px; background-color: #ff6666; background-image: linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 5px 5px, 5px 5px; border: 1px solid #e74c3c; }
        .icon-10 { width: 15px; height: 50px; background-color: #4dc3a3; background-image: linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 100% 5px; border: 1px solid #1abc9c; }
        .icon-1 { width: 20px; height: 20px; background-color: #f1c40f; border: 1px solid #f39c12; }

        .buttons button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 10px; }
        .btn-hint { background-color: #f1c40f; color: #333; }
        .btn-submit { background-color: #8bc34a; color: #fff; }

        /* 拖曳中的分身 */
        .dragging { position: fixed; opacity: 0.9; z-index: 1000; pointer-events: none; margin: 0 !important; }
        
        /* 特效 */
        .flash { animation: flashAnim 0.5s 2; }
        @keyframes flashAnim { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); box-shadow: 0 0 10px yellow; } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">134 <span style="color: #e74c3c;">變成</span> 124</div>
        <div class="subtitle">請操作積木（拿走10）</div>
    </div>

    <!-- 位值表區域 -->
    <div class="board">
        <div class="zone zone-hundreds" id="zone-100">
            <div class="zone-title">百位</div>
            <div class="hint-text">(拖入增加/拖至左下移除)</div>
            <div id="container-100">
                <div class="block block-100" data-value="100"></div>
            </div>
        </div>
        <div class="zone zone-tens" id="zone-10">
            <div class="zone-title">十位</div>
            <div class="hint-text">(點擊打碎/拖至左下移除)</div>
            <div id="container-10">
                <div class="block block-10" data-value="10"></div>
                <div class="block block-10" data-value="10"></div>
                <div class="block block-10" data-value="10"></div>
            </div>
        </div>
        <div class="zone zone-ones" id="zone-1">
            <div class="zone-title">個位</div>
            <div class="hint-text">(拖至左下移除)</div>
            <div class="ten-frame-wrapper">
                <!-- 底部淺色空框 -->
                <div class="ten-frame-bg">
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                </div>
                <!-- 實際積木容器 -->
                <div class="ten-frame" id="container-1">
                    <div class="block block-1" data-value="1"></div>
                    <div class="block block-1" data-value="1"></div>
                    <div class="block block-1" data-value="1"></div>
                    <div class="block block-1" data-value="1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部：預備區 -->
    <div class="footer">
        <div class="source-area" id="source-area">
            <div class="source-item" data-source="100">
                <div class="source-icon icon-100"></div>
                <div class="source-label">百 (100)</div>
            </div>
            <div class="source-item" data-source="10">
                <div class="source-icon icon-10"></div>
                <div class="source-label">十 (10)</div>
            </div>
            <div class="source-item" data-source="1">
                <div class="source-icon icon-1"></div>
                <div class="source-label">一 (1)</div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn-hint" onclick="playHint()">需要提示</button>
            <button class="btn-submit" onclick="checkAnswer()">提交答案</button>
        </div>
    </div>

<script>
    // 【核心修復】徹底封殺瀏覽器原生拖曳，避免出現影片中的禁止符號！
    document.addEventListener('dragstart', (e) => e.preventDefault());
    
    const sourceArea = document.getElementById('source-area');
    const containers = {
        '100': document.getElementById('container-100'),
        '10': document.getElementById('container-10'),
        '1': document.getElementById('container-1')
    };

    let draggedElement = null;
    let dragClone = null;
    let dragType = null; // 'new' (從預備區來) 或 'move' (從位值表來)
    let sourceValue = null;
    let startX = 0, startY = 0;
    let isDragging = false; // 用來區分是單純「點擊」還是「拖曳」

    document.addEventListener('pointerdown', handlePointerDown, { passive: false });
    document.addEventListener('pointermove', handlePointerMove, { passive: false });
    document.addEventListener('pointerup', handlePointerUp);

    function handlePointerDown(e) {
        // 只允許左鍵或觸控
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        const block = e.target.closest('.block');
        const sourceItem = e.target.closest('.source-item');

        if (block) {
            e.preventDefault(); // 阻擋文字選取
            draggedElement = block;
            dragType = 'move';
            sourceValue = block.getAttribute('data-value');
            startX = e.clientX;
            startY = e.clientY;
            isDragging = false; // 初始設為未拖曳 (等待 move 觸發)
            
            // 建立分身
            createClone(block, e.clientX, e.clientY);
            block.style.opacity = '0.2'; // 讓原本的積木變透明
            
        } else if (sourceItem) {
            e.preventDefault();
            dragType = 'new';
            sourceValue = sourceItem.getAttribute('data-source');
            startX = e.clientX;
            startY = e.clientY;
            isDragging = true; // 從預備區拿必定視為拖曳
            
            // 產生一個正確大小的真實積木作為分身，而不是拿縮小的 Icon
            const tempBlock = document.createElement('div');
            tempBlock.className = `block block-${sourceValue}`;
            document.body.appendChild(tempBlock);
            createClone(tempBlock, e.clientX, e.clientY);
            tempBlock.remove(); // 用完即丟
        }
    }

    function createClone(refElement, x, y) {
        dragClone = refElement.cloneNode(true);
        dragClone.classList.add('dragging');
        dragClone.style.opacity = '0.9';
        // 關鍵：分身不能擋住指標事件，否則會抓不到底下的元素
        dragClone.style.pointerEvents = 'none'; 
        document.body.appendChild(dragClone);
        moveClone(x, y);
    }

    function moveClone(x, y) {
        if (!dragClone) return;
        const rect = dragClone.getBoundingClientRect();
        // 讓滑鼠/手指位於積木中心
        dragClone.style.left = (x - rect.width / 2) + 'px';
        dragClone.style.top = (y - rect.height / 2) + 'px';
    }

    function handlePointerMove(e) {
        if (!dragClone) return;
        e.preventDefault(); // 防止 iOS 捲動
        
        // 判斷是否真的有移動 (區分點擊和拖曳)
        if (!isDragging && dragType === 'move') {
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (Math.sqrt(dx*dx + dy*dy) > 5) {
                isDragging = true; // 移動超過 5 像素，確認為拖曳
            }
        }
        
        if (isDragging || dragType === 'new') {
            moveClone(e.clientX, e.clientY);
        }
    }

    function handlePointerUp(e) {
        if (!dragClone) return;

        const dropX = e.clientX;
        const dropY = e.clientY;

        dragClone.remove();
        dragClone = null;

        // 如果只是「點擊(沒拖曳)」，且點的是 10，則執行退位(打碎)
        if (dragType === 'move' && !isDragging) {
            draggedElement.style.opacity = '1';
            if (sourceValue === '10') {
                breakTenBlock(draggedElement);
            }
            draggedElement = null;
            return;
        }

        // 處理放下的邏輯
        const targetElement = document.elementFromPoint(dropX, dropY);
        const targetZone = targetElement ? targetElement.closest('.zone') : null;
        
        const sourceAreaRect = sourceArea.getBoundingClientRect();
        // 判斷是否丟進左下角垃圾桶區
        const isDroppedInSource = (
            dropX >= sourceAreaRect.left && 
            dropX <= sourceAreaRect.right &&
            dropY >= sourceAreaRect.top && 
            dropY <= sourceAreaRect.bottom
        );

        if (dragType === 'new') {
            // 從來源區拖進對應的位值區 (新增積木)
            if (targetZone && targetZone.id === `zone-${sourceValue}`) {
                addBlock(sourceValue);
                playSound(800, 'sine'); // 成功放上：高音
            }
        } else if (dragType === 'move') {
            // 從位值區拖進垃圾桶 (刪除積木)
            if (isDroppedInSource) {
                draggedElement.remove();
                playSound(300, 'square'); // 刪除：低音
            } else {
                // 丟在其他地方，恢復原狀
                draggedElement.style.opacity = '1';
            }
        }

        draggedElement = null;
        checkAutoCarry();
    }

    function addBlock(val) {
        const newBlock = document.createElement('div');
        newBlock.className = `block block-${val}`;
        newBlock.setAttribute('data-value', val);
        containers[val].appendChild(newBlock);
    }

    // 將 1 個十打碎成 10 個一
    function breakTenBlock(blockElement) {
        blockElement.remove();
        for(let i=0; i<10; i++) {
            addBlock('1');
        }
        playSound(600, 'triangle'); // 退位音效
        document.getElementById('container-1').classList.add('flash');
        setTimeout(() => {
            document.getElementById('container-1').classList.remove('flash');
        }, 1000);
    }

    // 自動進位判斷 (滿10個1變1個10)
    function checkAutoCarry() {
        const ones = containers['1'].querySelectorAll('.block-1');
        if (ones.length >= 10) {
            setTimeout(() => {
                for(let i=0; i<10; i++) {
                    ones[i].remove();
                }
                addBlock('10');
                playSound(1000, 'sine'); // 進位音效
                document.getElementById('zone-10').classList.add('flash');
                setTimeout(() => document.getElementById('zone-10').classList.remove('flash'), 1000);
            }, 300); // 稍微延遲讓學生看到滿10的瞬間
        }
    }

    // 簡易合成音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function checkAnswer() {
        const h = containers['100'].querySelectorAll('.block-100').length;
        const t = containers['10'].querySelectorAll('.block-10').length;
        const o = containers['1'].querySelectorAll('.block-1').length;
        
        const total = h * 100 + t * 10 + o;
        
        if (total === 124) {
            alert('答對了！你拿走了 10，134 變成 124。');
        } else {
            alert(`目前是 ${total}，再試著「拿走10」看看！(把綠色積木拖到左下角)`);
        }
    }
    
    function playHint() {
        // 提示：讓十位數的區域閃爍
        const zone10 = document.getElementById('zone-10');
        zone10.classList.add('flash');
        setTimeout(() => zone10.classList.remove('flash'), 1000);
    }
</script>
</body>
</html>
