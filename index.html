<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>位值積木操作</title>
    <style>
        /* 基礎重置與防呆設定，防止 iPad 瀏覽器原生手勢干擾 */
        body { margin: 0; font-family: '微軟正黑體', sans-serif; background-color: #f4f7f9; touch-action: none; user-select: none; }
        .header { text-align: center; padding: 20px 0; }
        .title { font-size: 28px; font-weight: bold; color: #333; }
        .subtitle { font-size: 18px; color: #7f8c8d; margin-top: 5px; }

        /* 位值表主區域 */
        .board { display: flex; justify-content: center; gap: 20px; padding: 20px; }
        .zone { width: 250px; height: 350px; border: 3px solid; border-radius: 10px; background: white; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        .zone-hundreds { border-color: #ff9999; }
        .zone-tens { border-color: #99e6cc; }
        .zone-ones { border-color: #ffeba8; }
        
        .zone-title { padding: 5px 20px; color: white; border-radius: 5px; margin-top: -15px; font-weight: bold; font-size: 20px;}
        .zone-hundreds .zone-title { background-color: #ff6666; }
        .zone-tens .zone-title { background-color: #4dc3a3; }
        .zone-ones .zone-title { background-color: #f1c40f; }

        .hint-text { font-size: 12px; color: #bdc3c7; margin-top: 10px; }

        /* 積木放置區 (特別是十格陣) */
        .block-container { flex-grow: 1; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 10px; padding-top: 20px; }
        .ten-frame { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        /* 積木樣式設計 */
        .block { cursor: grab; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); z-index: 10; touch-action: none; }
        .block-100 { width: 100px; height: 100px; background-color: #ff6666; border-radius: 5px; border: 1px solid #e74c3c; background-image: linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px); background-size: 10px 10px; }
        .block-10 { width: 30px; height: 120px; background-color: #4dc3a3; border-radius: 5px; border: 1px solid #1abc9c; background-image: linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px); background-size: 100% 12px; }
        .block-1 { width: 30px; height: 30px; background-color: #f1c40f; border-radius: 5px; border: 1px solid #f39c12; }

        /* 底部操作區 */
        .footer { display: flex; justify-content: space-between; padding: 20px 40px; background: white; border-top: 2px solid #ecf0f1; position: fixed; bottom: 0; width: 100%; box-sizing: border-box;}
        
        /* 預備區 (兼具垃圾桶功能) */
        .source-area { display: flex; gap: 20px; align-items: flex-end; padding: 10px; border: 2px dashed #bdc3c7; border-radius: 10px; background-color: #f8f9fa; }
        .source-item { display: flex; flex-direction: column; align-items: center; }
        .source-label { font-size: 14px; color: #7f8c8d; margin-top: 5px; }

        .buttons button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 10px; }
        .btn-hint { background-color: #f1c40f; color: #fff; }
        .btn-submit { background-color: #8bc34a; color: #fff; }

        /* 正在拖曳時的虛擬分身樣式 */
        .dragging { position: fixed; opacity: 0.8; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">134 <span style="color: #e74c3c;">變成</span> 124</div>
        <div class="subtitle">請操作積木（拿走10）</div>
    </div>

    <!-- 位值表區域 (拖入增加，拖出減少) -->
    <div class="board">
        <div class="zone zone-hundreds" id="zone-100">
            <div class="zone-title">百位</div>
            <div class="block-container" id="container-100"></div>
        </div>
        <div class="zone zone-tens" id="zone-10">
            <div class="zone-title">十位</div>
            <div class="hint-text">(長按可退位/拖至左下移除)</div>
            <div class="block-container" id="container-10">
                <!-- 預設題目 134 的 3 個十位 -->
                <div class="block block-10" data-value="10"></div>
                <div class="block block-10" data-value="10"></div>
                <div class="block block-10" data-value="10"></div>
            </div>
        </div>
        <div class="zone zone-ones" id="zone-1">
            <div class="zone-title">個位</div>
            <div class="hint-text">(拖至左下可移除)</div>
            <div class="block-container ten-frame" id="container-1">
                 <!-- 預設題目 134 的 4 個個位 -->
                 <div class="block block-1" data-value="1"></div>
                 <div class="block block-1" data-value="1"></div>
                 <div class="block block-1" data-value="1"></div>
                 <div class="block block-1" data-value="1"></div>
            </div>
        </div>
    </div>

    <!-- 底部：預備區 (作為來源與回收站) -->
    <div class="footer">
        <div class="source-area" id="source-area">
            <div class="source-item">
                <div class="block block-100" data-source="100"></div>
                <div class="source-label">百 (100)</div>
            </div>
            <div class="source-item">
                <div class="block block-10" data-source="10"></div>
                <div class="source-label">十 (10)</div>
            </div>
            <div class="source-item">
                <div class="block block-1" data-source="1"></div>
                <div class="source-label">一 (1)</div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn-hint">需要提示</button>
            <button class="btn-submit">提交答案</button>
        </div>
    </div>

<script>
    // 全域變數記錄拖曳狀態
    let draggedElement = null;
    let dragClone = null;
    let startX = 0, startY = 0;
    let originalParent = null;

    // 取得各個區域
    const sourceArea = document.getElementById('source-area');
    const zones = {
        100: document.getElementById('zone-100'),
        10: document.getElementById('zone-10'),
        1: document.getElementById('zone-1')
    };
    const containers = {
        100: document.getElementById('container-100'),
        10: document.getElementById('container-10'),
        1: document.getElementById('container-1')
    };

    // 綁定觸控與滑鼠事件 (iPad 相容)
    document.addEventListener('pointerdown', handlePointerDown);
    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', handlePointerUp);

    function handlePointerDown(e) {
        const target = e.target;
        // 確認點擊的是積木
        if (target.classList.contains('block')) {
            draggedElement = target;
            originalParent = target.parentElement;

            // 建立虛擬分身跟隨手指
            dragClone = target.cloneNode(true);
            dragClone.classList.add('dragging');
            document.body.appendChild(dragClone);

            moveClone(e.clientX, e.clientY);

            // 如果是已在位值表上的積木，暫時將其隱藏 (代表被拿起來)
            if (!originalParent.closest('#source-area')) {
                draggedElement.style.opacity = '0.3';
            }
            
            // 針對觸控裝置防止預設滾動
            e.preventDefault();
        }
    }

    function handlePointerMove(e) {
        if (!dragClone) return;
        moveClone(e.clientX, e.clientY);
    }

    function handlePointerUp(e) {
        if (!dragClone || !draggedElement) return;

        const dropX = e.clientX;
        const dropY = e.clientY;

        // 移除分身
        dragClone.remove();
        dragClone = null;
        draggedElement.style.opacity = '1';

        // 判斷放下的位置是否在某個目標區域內
        const targetElement = document.elementFromPoint(dropX, dropY);
        let handled = false;

        // 情況 A：從預備區拖出來
        if (originalParent.closest('#source-area')) {
            const blockValue = draggedElement.getAttribute('data-source');
            const targetZone = targetElement ? targetElement.closest('.zone') : null;
            
            // 如果成功放在對應的位值區，則在該區「新增」一個積木
            if (targetZone && targetZone.id === `zone-${blockValue}`) {
                const newBlock = document.createElement('div');
                newBlock.className = draggedElement.className;
                newBlock.setAttribute('data-value', blockValue);
                containers[blockValue].appendChild(newBlock);
                handled = true;
            }
        } 
        // 情況 B：從位值區拖出來 (移除/刪除邏輯)
        else {
            const sourceAreaRect = sourceArea.getBoundingClientRect();
            // 如果放下的位置落在左下角預備區的範圍內
            if (
                dropX >= sourceAreaRect.left && 
                dropX <= sourceAreaRect.right &&
                dropY >= sourceAreaRect.top && 
                dropY <= sourceAreaRect.bottom
            ) {
                // 從畫面中移除該積木，達成「減法」效果
                draggedElement.remove();
                handled = true;
            }
        }

        // 重置拖曳狀態
        draggedElement = null;
        originalParent = null;
    }

    function moveClone(x, y) {
        if (!dragClone) return;
        const rect = draggedElement.getBoundingClientRect();
        // 讓滑鼠/手指在積木中心點
        dragClone.style.left = (x - rect.width / 2) + 'px';
        dragClone.style.top = (y - rect.height / 2) + 'px';
    }
</script>

</body>
</html>
